  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title text-center mb-4 text-primary">Book Your Car</h2>
            <form action="booking.php" method="post">
              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="car" class="form-label">Select Car</label>
                <select id="car" name="car" class="form-select" required>
                  <option value="">-- Choose a car --</option>
                  <option value="swift">Maruti Swift</option>
                  <option value="innova">Toyota Innova</option>
                  <option value="ertiga">Suzuki Ertiga</option>
                  <option value="xuv500">Mahindra XUV500</option>
                </select>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="pickup_date" class="form-label">Pick-up Date</label>
                  <input type="date" id="pickup_date" name="pickup_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="return_date" class="form-label">Return Date</label>
                  <input type="date" id="return_date" name="return_date" class="form-control" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="pickup_location" class="form-label">Pick-up Location</label>
                <input type="text" id="pickup_location" name="pickup_location" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="drop_location" class="form-label">Drop Location</label>
                <input type="text" id="drop_location" name="drop_location" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Book Now</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
