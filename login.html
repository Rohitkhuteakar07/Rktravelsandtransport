<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - RK Car Rentals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-car"></i> RK Car Rentals</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cars.html"><i class="fas fa-car"></i> Cars</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html"><i class="fas fa-calendar-check"></i> Booking</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="fas fa-comments"></i> Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title text-center mb-4 text-primary">Login to Your Account</h2>
            <form action="dashboard.html" method="post">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
              </div>
              <div class="mb-3 text-end">
                <a href="#" class="text-decoration-none">Forgot Password?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="mt-3 text-center">
              <p>Don't have an account? <a href="#" class="text-decoration-none" data-bs-toggle="modal" data-bs-target="#registerModal">Register here</a></p>
            </div>

            <!-- Registration Modal -->
            <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Register New Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <form>
                      <div class="mb-3">
                        <label for="reg-name" class="form-label">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" required>
                      </div>
                      <div class="mb-3">
                        <label for="reg-email" class="form-label">Email</label>
                        <input type="email" id="reg-email" class="form-control" required>
                      </div>
                      <div class="mb-3">
                        <label for="reg-password" class="form-label">Password</label>
                        <input type="password" id="reg-password" class="form-control" required>
                      </div>
                      <div class="mb-3">
                        <label for="reg-confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" class="form-control" required>
                      </div>
                      <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-primary text-white text-center py-3 mt-5">
    <div class="container">
      <p>&copy; 2025 RK Car Rentals. All rights reserved.</p>
      <p><i class="fas fa-phone"></i> Contact: +1 (123) 456-7890 | <i class="fas fa-envelope"></i> info@rkcarrentals.com</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
